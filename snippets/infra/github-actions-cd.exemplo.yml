# Exemplo ilustrativo — não é código de produção.
# Pipeline CD genérico: build da API e publicação do frontend estático.
# Sem secrets reais, ARNs ou nomes de conta AWS.

name: CD — Sistema de Compras Corporativo (exemplo)

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  test-and-build-api:
    name: Testes e imagem da API
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências da API
        working-directory: api
        run: npm ci

      - name: Lint e testes
        working-directory: api
        run: |
          npm run lint
          npm test -- --coverage=false

      - name: Build TypeScript
        working-directory: api
        run: npm run build

      - name: Construir imagem (tag genérica)
        run: |
          echo "docker build -t exemplo-compras-api:${{ github.sha }} ./api"
          # push para registry ocorreria aqui com OIDC / roles — nunca com access key no YAML

  build-and-publish-frontend:
    name: Build e publish do frontend
    runs-on: ubuntu-latest
    needs: test-and-build-api
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar e buildar SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publicar artefatos estáticos (conceitual)
        run: |
          echo "Sincronizar web/dist com bucket do frontend"
          echo "Invalidar caminhos /index.html e /assets/* no CloudFront"
          # Credenciais via OIDC do provedor cloud — omitidas de propósito
